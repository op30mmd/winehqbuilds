name: Build & Release WineHQ-Staging for Ubuntu 26.04 (Resolute)

on:
  workflow_dispatch:  # Manual trigger
  schedule:
    - cron: '0 3 * * 0'  # Weekly on Sunday at 03:00 UTC

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04

    permissions:
      contents: write

    steps:
      - name: Install base tools (git + packaging + checkinstall)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates \
            devscripts fakeroot build-essential checkinstall

      - name: Checkout WineHQ-Staging source (staging tree)
        uses: actions/checkout@v4
        with:
          repository: wine-staging/wine-staging
          ref: master
          path: wine-source
          fetch-depth: 1

      - name: Prepare build environment (i386 + EXACT deps from Ubuntu's wine package)
        run: |
          # Enable deb-src (just in case)
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources

          apt-get update

          dpkg --add-architecture i386
          apt-get update

          # This is the key fix:
          # The wine-staging repo does NOT contain debian/control (it's pure upstream source + patches).
          # So we cannot use mk-build-deps or dpkg-buildpackage.
          # Instead we use Ubuntu 26.04's own "wine" package Build-Depends → 100% dependency match.
          apt-get build-dep -y --no-install-recommends wine

      - name: Bump version for Ubuntu Resolute
        id: version
        run: |
          cd wine-source

          UPSTREAM_VERSION=$(sed -n 's/^AC_INIT(\[Wine\], \[\([^]]*\)\].*/\1/p' configure.ac)

          BUILD_DATE=$(date +%Y%m%d)
          NEW_VERSION="${UPSTREAM_VERSION}~winehq-staging~resolute-${BUILD_DATE}"

          echo "NEW_VERSION=${NEW_VERSION}" >> $GITHUB_ENV
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT

          echo "✅ Version set to ${NEW_VERSION}"

      - name: Build WineHQ-Staging
        run: |
          cd wine-source

          # Standard Wine configure flags (you can extend this list if you need extra features)
          ./configure \
            --enable-win64 \
            --prefix=/usr \
            --with-x \
            --with-pulse \
            --with-dbus \
            --with-gstreamer \
            --with-vulkan \
            --disable-tests

          make -j$(nproc)

      - name: Create .deb package with checkinstall
        run: |
          cd wine-source

          mkdir -p ../artifacts

          # checkinstall creates a clean .deb from the "make install" step
          checkinstall \
            --install=no \
            --default \
            --pkgname=winehq-staging \
            --pkgversion="${NEW_VERSION}" \
            --pkgrelease=1 \
            --pkggroup=utils \
            --pakdir=../artifacts \
            --maintainer="GitHub Actions <actions@github.com>" \
            --backup=no \
            --deldoc=yes \
            --deldesc=yes \
            --strip=yes \
            make install

          echo "📦 Built package:"
          ls -lh ../artifacts/

      - name: Create GitHub Release with automatic tag + upload .deb
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_VERSION }}
          name: WineHQ-Staging ${{ env.NEW_VERSION }} for Ubuntu 26.04 (Resolute)
          body: |
            **Automatic build** of WineHQ-Staging for Ubuntu 26.04 (codename **Resolute**).

            - Built **inside official `ubuntu:26.04` container** → **100% matching dependencies**.
            - Compiled from the official `wine-staging` tree.
            - Packaged as a single installable `.deb` using Ubuntu's exact build dependencies.
            - Install with: `sudo dpkg -i winehq-staging_*.deb`

            Built on: ${{ github.event_name == 'schedule' && 'schedule' || 'workflow_dispatch' }}
          files: artifacts/*.deb
          draft: false
          prerelease: true
          generate_release_notes: true
