name: Build & Release WineHQ-Staging for Ubuntu 26.04 (Resolute)

on:
  workflow_dispatch:  # Manual trigger
  schedule:
    - cron: '0 3 * * 0'  # Weekly on Sunday at 03:00 UTC

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04

    permissions:
      contents: write

    steps:
      - name: Install base tools + Wine build dependencies (official WineHQ list)
        run: |
          apt-get update

          # Enable multiarch for 32-bit support (required by Wine)
          dpkg --add-architecture i386
          apt-get update

          # Official recommended dependencies from https://wiki.winehq.org/Building_Wine
          # This completely bypasses the broken "apt-get build-dep wine" (unicode-cldr-core conflict)
          apt-get install -y --no-install-recommends \
            build-essential \
            gcc-multilib gcc-mingw-w64 g++-mingw-w64 \
            libasound2-dev:i386 libasound2-dev \
            libpulse-dev:i386 libpulse-dev \
            libdbus-1-dev:i386 libdbus-1-dev \
            libfontconfig-dev:i386 libfontconfig-dev \
            libfreetype-dev:i386 libfreetype-dev \
            libgnutls28-dev:i386 libgnutls28-dev \
            libgl-dev:i386 libgl-dev \
            libunwind-dev:i386 libunwind-dev \
            libx11-dev:i386 libx11-dev \
            libxcomposite-dev:i386 libxcomposite-dev \
            libxcursor-dev:i386 libxcursor-dev \
            libxfixes-dev:i386 libxfixes-dev \
            libxi-dev:i386 libxi-dev \
            libxrandr-dev:i386 libxrandr-dev \
            libxrender-dev:i386 libxrender-dev \
            libxext-dev:i386 libxext-dev \
            libwayland-dev:i386 libwayland-dev \
            libegl-dev:i386 libegl-dev \
            libxkbcommon-dev:i386 libxkbcommon-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libsdl2-dev:i386 libsdl2-dev \
            libudev-dev:i386 libudev-dev \
            libvulkan-dev:i386 libvulkan-dev \
            libglu1-mesa-dev libosmesa6-dev \
            libv4l-dev:i386 libv4l-dev \
            liblcms2-dev libgphoto2-dev libcapi20-dev \
            libgsm1-dev libmpg123-dev libopenal-dev \
            libpcap0.8-dev libusb-1.0-0-dev \
            flex bison gettext pkg-config icoutils sharutils \
            fontforge-nox librsvg2-bin

          echo "✅ All Wine build dependencies installed (no unicode-cldr-core conflict)"

      - name: Checkout WineHQ-Staging source (staging tree)
        uses: actions/checkout@v4
        with:
          repository: wine-staging/wine-staging
          ref: master
          path: wine-source
          fetch-depth: 1

      - name: Bump version for Ubuntu Resolute
        id: version
        run: |
          cd wine-source

          UPSTREAM_VERSION=$(sed -n 's/^AC_INIT(\[Wine\], \[\([^]]*\)\].*/\1/p' configure.ac)

          BUILD_DATE=$(date +%Y%m%d)
          NEW_VERSION="${UPSTREAM_VERSION}~winehq-staging~resolute-${BUILD_DATE}"

          echo "NEW_VERSION=${NEW_VERSION}" >> $GITHUB_ENV
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT

          echo "✅ Version set to ${NEW_VERSION}"

      - name: Configure & Build WineHQ-Staging
        run: |
          cd wine-source

          # Standard Wine configure flags (64-bit + staging features)
          ./configure \
            --enable-win64 \
            --prefix=/usr \
            --with-x \
            --with-pulse \
            --with-dbus \
            --with-gstreamer \
            --with-vulkan \
            --with-sdl \
            --with-openal \
            --disable-tests

          make -j$(nproc)

      - name: Create .deb package with checkinstall
        run: |
          cd wine-source

          mkdir -p ../artifacts

          checkinstall \
            --install=no \
            --default \
            --pkgname=winehq-staging \
            --pkgversion="${NEW_VERSION}" \
            --pkgrelease=1 \
            --pkggroup=utils \
            --pakdir=../artifacts \
            --maintainer="GitHub Actions <actions@github.com>" \
            --backup=no \
            --deldoc=yes \
            --deldesc=yes \
            --strip=yes \
            --stripso=yes \
            make install

          echo "📦 Built package:"
          ls -lh ../artifacts/

      - name: Create GitHub Release with automatic tag + upload .deb
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_VERSION }}
          name: WineHQ-Staging ${{ env.NEW_VERSION }} for Ubuntu 26.04 (Resolute)
          body: |
            **Automatic build** of WineHQ-Staging for Ubuntu 26.04 (codename **Resolute**).

            - Built **inside official `ubuntu:26.04` container** using official WineHQ build dependencies.
            - Avoids the broken `apt-get build-dep wine` (unicode-cldr-core conflict in Ubuntu packaging).
            - 64-bit build with full staging patches.
            - Install with: `sudo dpkg -i winehq-staging_*.deb && sudo apt-get install -f`

            Built on: ${{ github.event_name == 'schedule' && 'schedule' || 'workflow_dispatch' }}
          files: artifacts/*.deb
          draft: false
          prerelease: true
          generate_release_notes: true
