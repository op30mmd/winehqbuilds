name: Build & Release WineHQ-Staging for Ubuntu 26.04 (Resolute)

on:
  workflow_dispatch:  # Manual trigger
  schedule:
    - cron: '0 3 * * 0'  # Weekly on Sunday at 03:00 UTC

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04

    permissions:
      contents: write

    steps:
      - name: Install base tools (git + packaging utilities)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates \
            devscripts equivs fakeroot build-essential

      - name: Checkout WineHQ-Staging source (staging tree)
        uses: actions/checkout@v4
        with:
          repository: wine-staging/wine-staging
          ref: master
          path: wine-source
          fetch-depth: 1

      - name: Prepare build environment (i386 + EXACT deps from debian/control)
        run: |
          # Enable deb-src (good practice for any build tools)
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources

          apt-get update

          dpkg --add-architecture i386
          apt-get update

          # === FIXED: Use mk-build-deps with explicit file path + equivs ===
          # This is the correct & most reliable way to install Build-Depends
          # from a local debian/control file inside a minimal container.
          # The "./debian/control" forces it to treat the argument as a file
          # (prevents the "apt-cache showsrc debian/control" error).
          cd wine-source
          mk-build-deps --install --remove \
            --tool='apt-get -y --no-install-recommends' \
            ./debian/control

      - name: Bump version & update changelog for Ubuntu Resolute
        id: version
        run: |
          cd wine-source

          UPSTREAM_VERSION=$(sed -n 's/^AC_INIT(\[Wine\], \[\([^]]*\)\].*/\1/p' configure.ac)

          BUILD_DATE=$(date +%Y%m%d)
          NEW_VERSION="${UPSTREAM_VERSION}~winehq-staging~resolute-${BUILD_DATE}"

          echo "NEW_VERSION=${NEW_VERSION}" >> $GITHUB_ENV
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT

          export DEBEMAIL="actions@github.com"
          export DEBFULLNAME="GitHub Actions CI"
          dch \
            --newversion "${NEW_VERSION}" \
            --distribution "resolute" \
            --force-distribution \
            --force-bad-version \
            "Automatic WineHQ-Staging build for Ubuntu 26.04 Resolute (${BUILD_DATE})."

          echo "✅ Changelog updated to ${NEW_VERSION}"

      - name: Build binary .deb packages
        run: |
          cd wine-source
          dpkg-buildpackage -b -uc -us -j$(nproc) --no-sign

      - name: Collect built .deb packages
        run: |
          mkdir -p artifacts
          shopt -s nullglob
          mv *.deb artifacts/ 2>/dev/null || true
          echo "📦 Built packages:"
          ls -lh artifacts/ | cat

      - name: Create GitHub Release with automatic tag + upload all .deb files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_VERSION }}
          name: WineHQ-Staging ${{ env.NEW_VERSION }} for Ubuntu 26.04 (Resolute)
          body: |
            **Automatic build** of WineHQ-Staging for Ubuntu 26.04 (codename **Resolute**).

            - Built **inside official `ubuntu:26.04` container** → **100% matching dependencies**.
            - Compiled from the official `wine-staging` tree.
            - All binary packages included.
            - Install with: `sudo dpkg -i *.deb`

            Built on: ${{ github.event_name == 'schedule' && 'schedule' || 'workflow_dispatch' }}
          files: artifacts/*.deb
          draft: false
          prerelease: true
          generate_release_notes: true
