name: Build & Release WineHQ-Staging for Ubuntu 26.04 (Resolute)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04

    permissions:
      contents: write

    steps:
      - name: Install dependencies
        run: |
          apt-get update

          # With New WoW64, we only need the MinGW compilers for 32-bit compilation.
          # We NO LONGER need 32-bit Unix libraries (lib...:i386).
          apt-get install -y --no-install-recommends \
            build-essential git python3 autoconf \
            gcc-mingw-w64 g++-mingw-w64 \
            libasound2-dev libpulse-dev libdbus-1-dev \
            libfontconfig-dev libfreetype-dev libgnutls28-dev \
            libgl-dev libunwind-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxrandr-dev \
            libxrender-dev libxext-dev libwayland-dev wayland-protocols \
            libegl-dev libxkbcommon-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libsdl2-dev libudev-dev \
            libvulkan-dev libglu1-mesa-dev libosmesa6-dev libv4l-dev \
            liblcms2-dev libgphoto2-dev libcapi20-dev libgsm1-dev \
            libmpg123-dev libopenal-dev libpcap0.8-dev libusb-1.0-0-dev \
            libcups2-dev libpcsclite-dev \
            flex bison gettext pkg-config icoutils sharutils \
            fontforge-nox librsvg2-bin

      - name: Clone Wine source
        run: |
          git clone --depth=1 https://github.com/wine-mirror/wine.git wine-source

      - name: Clone Wine-Staging
        run: |
          git clone --depth=1 https://github.com/wine-staging/wine-staging.git wine-staging

      - name: Apply staging patches
        run: |
          if [ -f "wine-staging/staging/patchinstall.py" ]; then
            cd wine-staging/staging
            python3 patchinstall.py DESTDIR=../../wine-source --all -W winedbg-Process_Arguments -W msxml3-whitespace
          elif [ -f "wine-staging/patches/patchinstall.py" ]; then
            cd wine-staging/patches
            python3 patchinstall.py DESTDIR=../../wine-source --all -W winedbg-Process_Arguments -W msxml3-whitespace
          elif [ -f "wine-staging/patches/patchinstall.sh" ]; then
            cd wine-staging/patches
            chmod +x patchinstall.sh
            ./patchinstall.sh DESTDIR=../../wine-source --all -W winedbg-Process_Arguments -W msxml3-whitespace
          else
            echo "Error: patchinstall script not found."
            exit 1
          fi

      - name: Bump version
        id: version
        run: |
          cd wine-source
          
          # Wine's configure.ac dynamically loads the version via m4 from the VERSION file.
          UPSTREAM_VERSION=$(grep -ioE 'version[-.0-9A-Za-z]+' VERSION | cut -d' ' -f2 | head -n1)
          
          if [ -z "$UPSTREAM_VERSION" ]; then
            UPSTREAM_VERSION="11.0"
          fi
          
          BUILD_DATE=$(date +%Y%m%d)
          
          # NEW_VERSION keeps the Debian-style ~ for the package control file
          NEW_VERSION="${UPSTREAM_VERSION}~winehq-staging~resolute-${BUILD_DATE}"
          
          # TAG_NAME strips the ~ so the Git release doesn't fail
          TAG_NAME="${UPSTREAM_VERSION}-winehq-staging-resolute-${BUILD_DATE}"
          
          echo "NEW_VERSION=${NEW_VERSION}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT

      - name: Configure & Build
        run: |
          cd wine-source
          ./configure \
            --enable-archs=x86_64,i386 \
            --prefix=/usr \
            --with-x \
            --with-pulse \
            --with-dbus \
            --with-gstreamer \
            --with-vulkan \
            --with-sdl \
            --with-openal \
            --disable-tests
          make -j$(nproc)

      - name: Package .deb
        run: |
          cd wine-source
          mkdir -p ../artifacts

          # Install to a local fakeroot directory
          make install DESTDIR=$(pwd)/debian-pkg

          # Calculate installed package size (in KB)
          INSTALLED_SIZE=$(du -ks debian-pkg | cut -f1)

          # Set up debian package metadata
          # Kept flush to the left so YAML indentation doesn't break the debian control syntax
          mkdir -p debian-pkg/DEBIAN
          cat <<EOF > debian-pkg/DEBIAN/control
          Package: winehq-staging
          Version: ${NEW_VERSION}-1
          Section: utils
          Priority: optional
          Architecture: amd64
          Installed-Size: ${INSTALLED_SIZE}
          Maintainer: actions@github.com
          Provides: wine, wine-common, wine64, wine32
          Conflicts: wine, wine-common, wine64, wine32, winehq-stable, winehq-devel, libwine
          Replaces: wine, wine-common, wine64, wine32, winehq-stable, winehq-devel, libwine
          Description: WineHQ-Staging
           Package created by GitHub Actions.
          EOF
          
          # Strip leading spaces from the control file just to be absolutely safe
          sed -i 's/^[ \t]*//' debian-pkg/DEBIAN/control
          # Ensure the description continuation line retains its necessary 1 leading space
          sed -i 's/^Package created by GitHub Actions./ Package created by GitHub Actions./' debian-pkg/DEBIAN/control

          # Build the package natively utilizing dpkg-deb
          dpkg-deb --build debian-pkg ../artifacts/winehq-staging_${TAG_NAME}-1_amd64.deb

          ls -lh ../artifacts/

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: WineHQ-Staging ${{ env.TAG_NAME }}
          files: artifacts/*.deb
          prerelease: true
